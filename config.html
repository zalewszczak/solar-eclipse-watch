<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipz settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, -apple-system, sans-serif; margin: 0; padding: 24px 16px; }
  #bar { height: 6px; border-radius: 3px; background: rgba(128,128,128,.25); overflow: hidden; margin: 16px 0; }
  #fill { height: 100%; width: 0; background: #ff6b00; transition: width .15s; }
  button { padding: 10px 16px; font-size: 16px; border-radius: 8px; border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; }
  #err { color: #c83c3c; margin: 12px 0; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<!--
  Bootstrap for the bundled settings page (newer Pebble apps; see package.json "configPage").
  The real page is generated by PKJS (src/pkjs/config-page.js) -- it is far too dynamic and
  too big to keep as a static file -- so this page only fetches it over the Pebble app's
  page <-> PKJS message channel, chunk by chunk, and then writes it into the document.
  The generated page keeps using the same `Pebble` object to send live changes back.
-->
<h2 id="title">Loading settings&hellip;</h2>
<div id="bar"><div id="fill"></div></div>
<div id="err"></div>
<button id="retry" style="display:none;">Try again</button>
<script>
(function () {
  var started = false;
  var titleEl = document.getElementById('title');
  var fillEl = document.getElementById('fill');
  var errEl = document.getElementById('err');
  var retryEl = document.getElementById('retry');

  function fail(text) {
    titleEl.textContent = 'Could not load the settings';
    errEl.style.display = 'block';
    errEl.textContent = text;
    retryEl.style.display = '';
    started = false;
  }

  function ask(index) {
    return Pebble.sendMessage('pkjs', { type: 'page', index: index });
  }

  function load() {
    if (started) return;
    started = true;
    errEl.style.display = 'none';
    retryEl.style.display = 'none';
    titleEl.textContent = 'Loading settings…';
    var parts = [];
    var attempts = 0;
    function next(index, total) {
      ask(index).then(function (reply) {
        if (!reply || typeof reply.chunk !== 'string') throw new Error('empty reply from the watchface');
        parts[index] = reply.chunk;
        total = reply.total || total || 1;
        fillEl.style.width = Math.round(((index + 1) / total) * 100) + '%';
        attempts = 0;
        if (index + 1 < total) return next(index + 1, total);
        var html = parts.join('');
        window.__bundledPage = true;
        document.open();
        document.write(html);
        document.close();
      }).catch(function (e) {
        if (++attempts < 3) return next(index, total);
        fail((e && e.message) || String(e));
      });
    }
    next(0, 0);
  }

  retryEl.onclick = load;

  if (typeof Pebble === 'undefined' || typeof Pebble.sendMessage !== 'function') {
    fail('This version of the Pebble app cannot open bundled settings pages.');
    return;
  }
  // Wait until PKJS is running before the first request.
  var readyTimer = setTimeout(function () { load(); }, 4000); // some apps may not fire 'ready' for pkjs
  Pebble.addEventListener('ready', function (e) {
    if (e && e.target && e.target !== 'pkjs') return;
    clearTimeout(readyTimer);
    load();
  });
})();
</script>
</body>
</html>
